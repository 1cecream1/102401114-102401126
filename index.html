<!-- 校园失物招领小程序 · 页面入口 · 2026秋软件工程作业二 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone-shell">

  <!-- ============ 首页 ============ -->
  <section class="view active" id="view-home">
    <header class="navbar">
      <h1 class="navbar-title">校园失物招领</h1>
      <p class="navbar-slogan">丢了东西别着急，捡到东西别闲着</p>
    </header>

    <div class="search-bar" onclick="go('search')">
      <span class="search-icon">🔍</span>
      <span class="search-placeholder">搜索物品名称，如：校园卡、钥匙…</span>
    </div>

    <div class="type-tabs" id="home-tabs"></div>

    <div class="filter-bar">
      <select id="filter-category" class="mini-select"></select>
      <select id="filter-place" class="mini-select"></select>
      <select id="filter-status" class="mini-select"></select>
    </div>

    <div class="sort-bar" id="sort-bar"></div>

    <div class="stat-strip" id="stat-strip"></div>

    <div class="card-list" id="home-list"></div>
    <div class="empty-state hidden" id="home-empty">
      <div class="empty-icon">📭</div>
      <div class="empty-title">暂时还没有信息</div>
      <div class="empty-sub">点底部「+」发布第一条信息吧</div>
    </div>
  </section>

  <!-- ============ 发布页 ============ -->
  <section class="view" id="view-post">
    <header class="navbar navbar-sub">
      <span class="navbar-back" onclick="go('home')">‹</span>
      <h1 class="navbar-title">发布信息</h1>
    </header>

    <div class="post-type-switch" id="post-type-switch"></div>

    <form class="post-form" id="post-form" novalidate>
      <div class="form-field">
        <label class="form-label">物品名称 <span class="req">*</span></label>
        <input type="text" id="f-name" class="form-input" placeholder="如：校园卡、黑色雨伞" maxlength="30">
        <p class="form-error" id="err-name"></p>
      </div>

      <div class="form-field">
        <label class="form-label">物品分类 <span class="req">*</span></label>
        <div class="chip-group" id="f-category"></div>
        <p class="form-error" id="err-category"></p>
      </div>

      <div class="form-field">
        <label class="form-label" id="label-place">丢失地点 <span class="req">*</span></label>
        <div class="chip-group" id="f-place"></div>
        <p class="form-error" id="err-place"></p>
      </div>

      <div class="form-field">
        <label class="form-label" id="label-time">丢失时间 <span class="req">*</span></label>
        <input type="datetime-local" id="f-time" class="form-input">
        <p class="form-error" id="err-time"></p>
      </div>

      <div class="form-field" id="field-reward">
        <label class="form-label">悬赏金额（选填）</label>
        <input type="number" id="f-reward" class="form-input" placeholder="如 20（单位：元，1~200 整数）"
               min="1" max="200" step="1" inputmode="numeric">
        <p class="form-hint">物品找回后自愿兑现，仅作展示，不涉及线上支付</p>
        <p class="form-error" id="err-reward"></p>
      </div>

      <div class="form-field">
        <label class="form-label">物品描述</label>
        <textarea id="f-desc" class="form-textarea" maxlength="200" placeholder="补充特征方便辨认，如：黑色雨伞，伞柄挂了只小黄鸭"></textarea>
        <p class="form-counter"><span id="desc-count">0</span>/200</p>
      </div>

      <div class="form-field">
        <label class="form-label">联系方式 <span class="req">*</span></label>
        <input type="text" id="f-contact" class="form-input" placeholder="微信号 / 手机号" maxlength="60">
        <p class="form-error" id="err-contact"></p>
      </div>

      <div class="similar-tip hidden" id="similar-tip"></div>

      <button type="submit" class="btn-primary">立即发布</button>
    </form>
  </section>

  <!-- ============ 搜索页 ============ -->
  <section class="view" id="view-search">
    <header class="navbar navbar-sub">
      <span class="navbar-back" onclick="go('home')">‹</span>
      <div class="search-input-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="搜索物品名称">
      </div>
      <span class="search-go" id="search-go">搜索</span>
    </header>

    <div class="hot-words">
      <span class="hot-label">热门：</span>
      <span class="hot-chips" id="hot-chips"></span>
    </div>

    <div class="result-tip" id="result-tip"></div>
    <div class="card-list" id="search-list"></div>
    <div class="empty-state hidden" id="search-empty">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">没有找到相关物品</div>
      <div class="empty-sub">换个关键词试试，或去发布一条求助信息</div>
    </div>
  </section>

  <!-- ============ 详情页 ============ -->
  <section class="view" id="view-detail">
    <header class="navbar navbar-sub">
      <span class="navbar-back" onclick="go('home')">‹</span>
      <h1 class="navbar-title">信息详情</h1>
    </header>
    <div class="detail-body" id="detail-body"></div>
  </section>

  <!-- ============ 我的发布 ============ -->
  <section class="view" id="view-mine">
    <header class="navbar">
      <h1 class="navbar-title">我的发布</h1>
    </header>
    <div class="mine-stats" id="mine-stats"></div>
        <div class="mine-stats" id="mine-stats"></div>
    <div style="text-align:center;margin:10px 0">
      <button type="button" class="btn-outline" style="font-size:13px;padding:6px 16px" onclick="resetData()">恢复示例数据</button>
    </div>
    <div class="card-list" id="mine-list"></div>

    <div class="card-list" id="mine-list"></div>
    <div class="empty-state hidden" id="mine-empty">
      <div class="empty-icon">📝</div>
      <div class="empty-title">你还没有发布过信息</div>
      <div class="empty-sub">点底部「+」发一条试试</div>
    </div>
  </section>

  <!-- ============ 发布成功 ============ -->
  <section class="view" id="view-success">
    <div class="success-wrap">
      <div class="success-icon">✅</div>
      <h2 class="success-title">发布成功</h2>
      <p class="success-sub">信息已公开，好心人看到会联系你</p>
      <button class="btn-primary" onclick="go('home')">返回首页</button>
      <button class="btn-ghost" id="btn-view-detail">查看详情</button>
    </div>
  </section>

  <!-- ============ 底部导航 ============ -->
  <nav class="tabbar" id="tabbar">
    <div class="tabbar-item" data-view="home" onclick="go('home')">
      <span class="tabbar-ico">🏠</span><span>首页</span>
    </div>
    <div class="tabbar-publish" onclick="go('post')">
      <span class="tabbar-plus">+</span>
    </div>
    <div class="tabbar-item" data-view="mine" onclick="go('mine')">
      <span class="tabbar-ico">👤</span><span>我的</span>
    </div>
  </nav>

  <!-- ============ 打赏弹层 ============ -->
  <div class="tip-mask hidden" id="tip-mask" onclick="closeTipPanel()">
    <div class="tip-panel" onclick="event.stopPropagation()">
      <div class="tip-panel-head">
        <h3 class="tip-panel-title">打赏拾金不昧者</h3>
        <p class="tip-panel-sub">心意随喜，不与物品价值挂钩</p>
      </div>

      <div class="tip-amounts" id="tip-amounts"></div>

      <input type="number" id="tip-custom" class="tip-custom"
             placeholder="自定义金额" min="1" max="200" step="1" inputmode="numeric">
      <input type="text" id="tip-note" class="tip-note-input"
             placeholder="留句话（选填，≤20 字）" maxlength="20">
      <p class="form-error" id="tip-err"></p>
      <p class="tip-demo-note">演示：打赏仅在本机记录，不涉及真实支付</p>

      <div class="tip-panel-actions">
        <button class="btn-ghost" type="button" onclick="closeTipPanel()">再想想</button>
        <button class="btn-primary" type="button" id="tip-confirm">确认打赏</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/constant.js"></script>
<script src="js/seed.js"></script>
<script src="js/reward.js"></script>
<script src="js/store.js"></script>
<script src="js/validate.js"></script>
<script src="js/search.js"></script>
<script src="js/status.js"></script>
<script src="js/app.js"></script>
</body>
</html>
